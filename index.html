<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi — Dolci &amp; Sapori</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="centered">
  <main class="card">
    <img src="assets/img/logo.png" alt="Dolci &amp; Sapori" class="logo">
    <h1>Gestionale Magazzino</h1>
    <p class="subtitle">Accedi per continuare</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <p class="error" id="error-message"></p>

      <button type="submit" id="submit-btn">Accedi</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
