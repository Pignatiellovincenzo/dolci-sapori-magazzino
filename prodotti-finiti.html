<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prodotti — Dolci &amp; Sapori</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app-body">
  <div class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Apri menu">&#9776;</button>
    <img src="assets/img/logo.png" alt="Dolci &amp; Sapori" class="logo" style="height:26px;margin:0;">
    <div class="spacer"></div>
    <span class="topbar-user" id="topbar-user"></span>
    <button class="logout-link" id="logout-btn" style="width:auto;">Esci</button>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="app-main">
    <h1>Prodotti</h1>

    <section class="panel">
      <h2 id="form-title">Nuovo prodotto</h2>
      <form id="prodotto-form">
        <input type="hidden" id="prodotto-id">
        <div class="form-row">
          <div>
            <label for="codice">Codice prodotto</label>
            <input type="text" id="codice">
          </div>
          <div>
            <label for="nome">Nome *</label>
            <input type="text" id="nome" required>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="unita-base">Unità di misura base *</label>
            <select id="unita-base" required></select>
          </div>
          <div>
            <label for="giorni-preavviso">Giorni di preavviso scadenza</label>
            <input type="number" id="giorni-preavviso" min="0" value="0">
          </div>
        </div>

        <label>Ricetta — resa per 1 batch/infornata</label>
        <div class="form-row">
          <div>
            <label for="resa-quantita">Quantità prodotta per batch</label>
            <input type="number" id="resa-quantita" min="0" step="any">
          </div>
          <div>
            <label for="resa-unita">Unità</label>
            <select id="resa-unita"></select>
          </div>
        </div>

        <label>Ingredienti (per 1 batch)</label>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Materia prima</th><th>Quantità</th><th>Unità</th><th></th></tr></thead>
            <tbody id="ingredienti-tbody"></tbody>
          </table>
        </div>
        <div class="form-row">
          <div>
            <label for="ingrediente-materia">Materia prima</label>
            <select id="ingrediente-materia"></select>
          </div>
          <div>
            <label for="ingrediente-unita">Unità</label>
            <select id="ingrediente-unita"></select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="ingrediente-quantita">Quantità per batch</label>
            <input type="number" id="ingrediente-quantita" min="0" step="any">
          </div>
          <div></div>
        </div>
        <button type="button" id="aggiungi-ingrediente-btn">Aggiungi ingrediente</button>
        <p class="empty-state" id="allergeni-anteprima">Allergeni (calcolati dagli ingredienti): —</p>

        <details>
          <summary>Note</summary>
          <textarea id="note" rows="2"></textarea>
        </details>

        <p class="error" id="error-message"></p>
        <div class="btn-row">
          <button type="submit" id="submit-btn">Salva</button>
          <button type="button" class="btn-secondary" id="cancel-btn" hidden>Annulla</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Elenco prodotti</h2>
      <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
        <input type="checkbox" id="mostra-disattivati-check" style="width:auto; margin:0;">
        Mostra anche i disattivati
      </label>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Codice</th><th>Nome</th><th>Unità base</th><th>Allergeni</th><th>Stato</th><th></th></tr></thead>
          <tbody id="prodotti-tbody"></tbody>
        </table>
      </div>
      <p class="empty-state" id="empty-state" hidden>Nessun prodotto inserito.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/prodotti-finiti.js"></script>
</body>
</html>
