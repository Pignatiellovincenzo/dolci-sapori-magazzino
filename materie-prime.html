<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materie Prime — Dolci &amp; Sapori</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app-body">
  <div class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Apri menu">&#9776;</button>
    <img src="assets/img/logo.png" alt="Dolci &amp; Sapori" class="logo" style="height:26px;margin:0;">
    <div class="spacer"></div>
    <span class="topbar-user" id="topbar-user"></span>
    <button class="logout-link" id="logout-btn" style="width:auto;">Esci</button>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="app-main">
    <h1>Materie Prime</h1>

    <section class="panel">
      <h2 id="form-title">Nuova materia prima</h2>
      <form id="materia-form">
        <input type="hidden" id="materia-id">
        <div class="form-row">
          <div>
            <label for="nome">Nome *</label>
            <input type="text" id="nome" required>
          </div>
          <div>
            <label for="fornitore-select">Fornitore</label>
            <select id="fornitore-select"><option value="">— nessuno —</option></select>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="unita1-select">Unità di misura 1 *</label>
            <select id="unita1-select" required></select>
          </div>
          <div>
            <label for="unita2-select">Unità di misura 2 (facoltativa)</label>
            <select id="unita2-select"><option value="">— nessuna —</option></select>
          </div>
        </div>
        <div class="form-row" id="fattore-row" hidden>
          <div>
            <label id="fattore-label" for="fattore-input">Conversione</label>
            <input type="number" id="fattore-input" min="0" step="any">
          </div>
          <div></div>
        </div>
        <div class="form-row">
          <div>
            <label for="unita-acquisto-select">Unità da mostrare in acquisto/carico</label>
            <select id="unita-acquisto-select"></select>
          </div>
          <div>
            <label for="unita-magazzino-select">Unità da mostrare in giacenza</label>
            <select id="unita-magazzino-select"></select>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="giorni-preavviso">Giorni di preavviso scadenza</label>
            <input type="number" id="giorni-preavviso" min="0" value="0">
          </div>
          <div>
            <label for="scorta-minima">Scorta minima (nell'unità magazzino)</label>
            <input type="number" id="scorta-minima" min="0" step="any" value="0">
          </div>
        </div>

        <details>
          <summary>Allergeni</summary>
          <div class="checkbox-grid" id="allergeni-grid"></div>
        </details>

        <label for="note">Note</label>
        <textarea id="note" rows="2"></textarea>

        <p class="error" id="error-message"></p>
        <div class="btn-row">
          <button type="submit" id="submit-btn">Salva</button>
          <button type="button" class="btn-secondary" id="cancel-btn" hidden>Annulla</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Elenco materie prime</h2>
      <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
        <input type="checkbox" id="mostra-disattivati-check" style="width:auto; margin:0;">
        Mostra anche le disattivate
      </label>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Nome</th><th>Unità</th><th>Fornitore</th><th>Scorta min.</th><th>Allergeni</th><th>Stato</th><th></th></tr>
          </thead>
          <tbody id="materie-tbody"></tbody>
        </table>
      </div>
      <p class="empty-state" id="empty-state" hidden>Nessuna materia prima inserita.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth-guard.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/materie-prime.js"></script>
</body>
</html>
